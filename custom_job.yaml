workerPoolSpecs:
- machineSpec:
    machineType: n1-standard-4
    acceleratorType: NVIDIA_TESLA_T4
    acceleratorCount: 1
  replicaCount: 1
  containerSpec:
    imageUri: TRAIN_IMAGE_PLACEHOLDER
    args:
    - --data_dir=DATASET_URI_PLACEHOLDER
    - --output_dir=OUTPUT_URI_PLACEHOLDER
    env:
    - name: REGION
      value: us-central1
    - name: EXPERIMENT_NAME
      value: gourmetgram-managed-training
